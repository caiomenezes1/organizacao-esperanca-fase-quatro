<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Organização Esperança — Cadastro</title><link rel="stylesheet" href="style.css"/><style>main.container{display:block;width:90%;max-width:1200px;margin:var(--space-lg) auto}article{width:100%;background:#fff;padding:var(--space-md);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);color:#000}header h2,header p.lead{font-family:'Helvetica',sans-serif;margin-bottom:var(--space-sm)}form input,form textarea,form select{width:100%;padding:var(--space-sm);margin-bottom:var(--space-md);border:1px solid #ccc;border-radius:4px;font-size:var(--fs-md)}form button{margin-top:1rem;background:var(--cor-accent);border:none;color:#fff;padding:.8rem 1.2rem;border-radius:6px;cursor:pointer;font-size:1rem;transition:background .3s ease,transform .2s ease;display:inline-block}form button:hover{background:#095ab0;transform:translateY(-1px)}form button:focus{outline:2px solid #0a74da;outline-offset:2px}.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:flex-end}.toast{min-width:250px;padding:1rem 1.5rem;border-radius:6px;color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.15);opacity:.95;font-size:var(--fs-sm);animation:slideIn .3s ease forwards,fadeOut .5s ease 4.5s forwards;position:relative}.toast.success{background-color:#27ae60}.toast.error{background-color:#e74c3c}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:.95}}@keyframes fadeOut{from{opacity:.95}to{opacity:0;height:0;margin:0;padding:0}}</style></head><body><main class="container"><article><header><h2>Cadastro de Voluntário</h2><p class="lead">Preencha o formulário abaixo para se cadastrar em nossos projetos sociais.</p></header><form id="form-cadastro" novalidate><fieldset><legend>Informações Pessoais</legend><label for="nome">Nome completo *</label><input id="nome" required/><label for="email">E-mail *</label><input id="email" type="email" required/><label for="cpf">CPF *</label><input id="cpf" required maxlength="14"/><label for="telefone">Telefone *</label><input id="telefone" required maxlength="15"/><label for="nascimento">Data de Nascimento *</label><input id="nascimento" type="date" required/></fieldset><fieldset><legend>Endereço</legend><label for="endereco">Endereço *</label><input id="endereco" required/><label for="cep">CEP *</label><input id="cep" required maxlength="9"/><label for="cidade">Cidade *</label><input id="cidade" required/><label for="estado">Estado *</label><select id="estado" required><option value="">Selecione...</option><option>SP</option><option>RJ</option><option>MG</option><option>BA</option><option>RS</option><option>PR</option><option>SC</option><option>GO</option></select></fieldset><fieldset><legend>Área de Interesse</legend><label for="interesse">Selecione uma opção *</label><select id="interesse" required><option value="">Selecione...</option><option>Educação</option><option>Alimentação</option><option>Eventos</option></select><label for="mensagem">Mensagem (opcional)</label><textarea id="mensagem" rows="5"></textarea></fieldset><button type="submit">Enviar</button></form></article></main><div class="toast-container" id="toast-container"></div><script>const form=document.getElementById("form-cadastro"),toastContainer=document.getElementById("toast-container");function showToast(e,t="success"){const o=document.createElement("div");o.className=`toast ${t}`,o.textContent=e,toastContainer.appendChild(o),setTimeout(()=>{o.style.height=o.offsetHeight+"px",o.style.transition="all .5s ease",o.style.opacity=0,o.style.margin=0,o.style.padding=0,setTimeout(()=>o.remove(),500)},5e3)}function mascara(e,t){let o=e.value.replace(/\D/g,"");"cpf"===t&&(e.value=o.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4")),"telefone"===t&&(e.value=o.replace(/(\d{2})(\d{5})(\d{4})/,"($1) $2-$3")),"cep"===t&&(e.value=o.replace(/(\d{5})(\d{3})/,"$1-$2"))}document.getElementById("cpf").addEventListener("input",e=>mascara(e.target,"cpf")),document.getElementById("telefone").addEventListener("input",e=>mascara(e.target,"telefone")),document.getElementById("cep").addEventListener("input",e=>mascara(e.target,"cep")),form.addEventListener("submit",e=>{e.preventDefault();const t=form.querySelectorAll("input[required], select[required]");let o=!0;t.forEach(e=>{e.value.trim()||(o=!1,showToast(`O campo "${e.previousElementSibling.textContent.replace("*","").trim()}" está em branco.`,"error"))});const a=document.getElementById("cpf").value;a&&!/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(a)&&(o=!1,showToast("CPF inválido. Use o formato 000.000.000-00.","error"));const n=document.getElementById("cep").value;n&&!/^\d{5}-\d{3}$/.test(n)&&(o=!1,showToast("CEP inválido. Use o formato 00000-000.","error")),o&&(showToast("Cadastro realizado com sucesso!","success"),form.reset())});</script></body></html>
